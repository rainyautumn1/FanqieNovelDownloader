name: macOS Build & Test

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'LICENSE'

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Verify imports
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')
          # Test that all modules can be imported without Qt GUI (headless)
          import requests, bs4, lxml, ebooklib, openpyxl
          from version import VERSION
          print(f'Version: {VERSION}')
          print('All core imports OK')
          "

      - name: Build with PyInstaller
        run: |
          chmod +x build.sh
          bash build.sh

      - name: Verify build output
        run: |
          if [ -d "dist/FanqieNovelDownloader" ]; then
            echo "Build directory exists"
            ls -la dist/FanqieNovelDownloader/
            if [ -f "dist/FanqieNovelDownloader/FanqieNovelDownloader" ]; then
              echo "Executable found"
              file dist/FanqieNovelDownloader/FanqieNovelDownloader
            fi
          else
            echo "ERROR: Build output not found!"
            exit 1
          fi

      - name: Package as zip for distribution
        run: |
          cd dist
          zip -r ../FanqieNovelDownloader-macOS.zip FanqieNovelDownloader/
          cd ..
          ls -lh FanqieNovelDownloader-macOS.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FanqieNovelDownloader-macOS
          path: FanqieNovelDownloader-macOS.zip
          retention-days: 30

      - name: Extract version
        run: |
          APP_VERSION=$(python -c "from version import VERSION; print(VERSION)")
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV
          echo "Version: $APP_VERSION"

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          name: "macOS v${{ env.APP_VERSION }}"
          tag_name: "mac-v${{ env.APP_VERSION }}"
          files: FanqieNovelDownloader-macOS.zip
          draft: false
          prerelease: true
          body: |
            ## 番茄小说下载器 macOS 版本

            这是自动构建的 macOS 版本，基于 PyInstaller 打包。

            ### 使用方法
            1. 下载 `FanqieNovelDownloader-macOS.zip`
            2. 解压后双击 `FanqieNovelDownloader` 或在终端运行 `./FanqieNovelDownloader`
            3. 如提示"无法验证开发者"，请前往 **系统设置 → 隐私与安全性 → 仍要打开**

            ### 注意事项
            - 本版本为自动构建，未经过完整测试
            - 如有问题请在 [Issues](https://github.com/rainyautumn1/FanqieNovelDownloader/issues) 反馈

      - name: Run headless smoke test
        run: |
          python -c "
          import os, sys
          scripts = ['main.py', 'downloader.py', 'workers.py', 'ui_components.py',
                     'download_manager.py', 'download_ui.py', 'update_manager.py',
                     'logging_config.py']
          for s in scripts:
              if os.path.exists(s):
                  with open(s) as f:
                      compile(f.read(), s, 'exec')
                      print(f'  {s}: syntax OK')
          print('All scripts pass syntax check')
          "
